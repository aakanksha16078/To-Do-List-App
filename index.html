<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1> To-Do List!</h1>
    <p>Welcome to this To-do List. Double click to edit the To-do</p>
    <!-- Input and button to add new tools -->
    <input type="text" id="to-doinput" placeholder="Enter a to-do and press Add or Enter">

    <button id="btn">Add</button>
    <ul id="to-dolist"></ul>
    <script src="script.js"></script>
</body>
</html>
